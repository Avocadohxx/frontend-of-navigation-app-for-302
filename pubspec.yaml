# 初次下载使用 '''flutter doctor''' 检查需要安装的包
# 初次运行使用 ‘’‘flutter pub get''' 初始化依赖
# flutter clean

name: version4
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.9.2

# 在运行时所需要的依赖库
dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.3
  http: ^1.5.0
  image_picker: ^1.0.7 #用户可以从本地图库选择图片
  cupertino_icons: ^1.0.8 #图标，模仿ios风格
  # 临时注释高德地图插件，解决与Flutter 3.38兼容性问题
  # amap_flutter_location: ^3.0.0 # 使用高德地图 Flutter 插件中的位置服务功能
  # amap_flutter_map: ^3.0.0 # 高德地图 Flutter 插件的地图显示功能
  # amap_flutter_base: ^3.0.0 # 高德地图 Flutter 插件的基础功能
  permission_handler: ^12.0.1 # 请求和检查应用权限
  dio: ^4.0.6
  url_launcher: ^6.1.7 # 启动url，打开网页等
  flutter_speed_dial: ^6.2.0 # 快速拨号组件
  google_fonts: ^6.3.2 # google字体

# 仅在开发过程中需要的依赖库
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  assets:
    - assets/images/background.jpg
  #   - images/a_dot_ham.jpeg
    - assets/images/avatar.png
    - assets/images/muti-mode.png
    - assets/images/smart-path.png
  uses-material-design: true # Material Design 组件

